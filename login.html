<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogDetective - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        .login-card { max-width: 420px; width: 100%; margin: auto; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-shield-halved text-primary me-2"></i>LogDetective
            </a>
            <div class="ms-auto">
                <a href="signup.html" class="btn btn-outline-light btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="card shadow-sm border-0 login-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 50px; height: 50px;">
                        <i class="fa-solid fa-lock fa-lg"></i>
                    </div>
                    <h4 class="fw-bold">Sign In</h4>
                    <p class="text-muted small">Select your role to access the workspace</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Target User Role</label>
                        <select class="form-select" id="userRoleSelect" required>
                            <option value="admin">Security Analyst / Administrator</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email / Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="emailInput" value="analyst@logdetective.local" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" class="form-control" value="••••••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="small text-decoration-none">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3 fw-semibold">
                        Log In <i class="fa-solid fa-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center border-top pt-3">
                    <span class="small text-muted">Don't have an account? <a href="signup.html" class="text-primary text-decoration-none fw-semibold">Create account</a></span>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white py-3 mt-auto text-center">
        <small class="text-muted">&copy; 2026 LogDetective - All Rights Reserved</small>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('userRoleSelect').value;
            if (role === 'admin') {
                window.location.href = 'adminDashboard.html';
            } 
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
