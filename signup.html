<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogDetective - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        .signup-card { max-width: 520px; width: 100%; margin: auto; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-shield-halved text-primary me-2"></i>LogDetective
            </a>
            <div class="ms-auto">
                <a href="login.html" class="btn btn-outline-light btn-sm">Log In</a>
            </div>
        </div>
    </nav>
    <div class="container my-auto py-5">
        <div class="card shadow-sm border-0 signup-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h4 class="fw-bold">Create Account</h4>
                    <p class="text-muted small">Register to upload log files and monitor background execution</p>
                </div>

                <form action="adminDashboard.html">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">First Name</label>
                            <input type="text" class="form-control" placeholder="Arbaz" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Last Name</label>
                            <input type="text" class="form-control" placeholder="Khan" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Work Email</label>
                        <input type="email" class="form-control" placeholder="student@university.edu" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Assigned System Role</label>
                        <select class="form-select" required>
                            <option value="analyst">Security Analyst / Administrator</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            I agree to the project guidelines & usage terms.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-semibold mb-3">Complete Registration</button>
                </form>

                <div class="text-center border-top pt-3">
                    <span class="small text-muted">Already registered? <a href="login.html" class="text-primary text-decoration-none fw-semibold">Sign in here</a></span>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white py-3 mt-auto text-center">
        <small class="text-muted">&copy; 2026 LogDetective - All Rights Reserved</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
